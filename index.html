<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>双界回廊 · AI 少女</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #081016; }
  body { display: grid; place-items: center; overflow: hidden; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 150vh); height: min(100vh, 66.6667vw); image-rendering: pixelated; image-rendering: crisp-edges; background: #0b141c; border: 1px solid #24414c; box-shadow: 0 0 34px rgba(74, 205, 222, .16); }
  #fullscreen-btn { position: absolute; top: 14px; right: 14px; z-index: 2; padding: 7px 10px; border: 1px solid rgba(135, 237, 242, .55); border-radius: 5px; background: rgba(6, 22, 29, .78); color: #b9fbfa; font: 700 12px system-ui, sans-serif; cursor: pointer; }
  #fullscreen-btn:hover { background: rgba(46, 113, 126, .8); }
  #touch { position: absolute; inset: auto 0 10px; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  .touch-group { display: flex; gap: 8px; }
  .touch-btn { width: 48px; height: 42px; border: 1px solid rgba(135, 237, 242, .42); border-radius: 8px; background: rgba(6, 22, 29, .78); color: #b9fbfa; font: 700 18px system-ui; pointer-events: auto; touch-action: none; }
  .touch-btn:active { background: rgba(70, 190, 202, .45); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="双界回廊游戏画面"></canvas>
  <button id="fullscreen-btn" type="button">全屏 F</button>
  <div id="touch" aria-hidden="true">
    <div class="touch-group"><button class="touch-btn" data-key="ArrowLeft">◀</button><button class="touch-btn" data-key="ArrowRight">▶</button></div>
    <div class="touch-group"><button class="touch-btn" data-key="KeyQ">Q</button><button class="touch-btn" data-key="Space">跳</button></div>
  </div>
</div>

/* ================================================================

   逻辑分辨率 480×320；角色沿用前作像素素材，场景使用 CC0 像素素材与程序化绘制。
   ================================================================ */
const W = 480, H = 320;
const RENDER_SCALE = 2;
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
ctx.scale(RENDER_SCALE, RENDER_SCALE);

const fullscreenButton = document.querySelector('#fullscreen-btn');
function updateFullscreenLabel() {
  fullscreenButton.textContent = document.fullscreenElement ? '退出全屏 F' : '全屏 F';
}
async function toggleFullscreen() {
  if (document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
  updateFullscreenLabel();
}
fullscreenButton.addEventListener('click', () => toggleFullscreen().catch(() => say('浏览器未允许全屏')));
document.addEventListener('fullscreenchange', updateFullscreenLabel);

const input = { down: new Set(), pressed: new Set() };
addEventListener('keydown', event => {
  const code = event.code;
  if (!input.down.has(code)) input.pressed.add(code);
  input.down.add(code);
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(code)) event.preventDefault();
  if (code === 'KeyF' && !event.repeat) toggleFullscreen().catch(() => say('浏览器未允许全屏'));
});
addEventListener('keyup', event => input.down.delete(event.code));
function isDown(...codes) { return codes.some(code => input.down.has(code)); }
function wasPressed(...codes) { return codes.some(code => input.pressed.has(code)); }

for (const button of document.querySelectorAll('.touch-btn')) {
  const code = button.dataset.key;
  const down = event => { event.preventDefault(); if (!input.down.has(code)) input.pressed.add(code); input.down.add(code); };
  const up = event => { event.preventDefault(); input.down.delete(code); };
  button.addEventListener('pointerdown', down);
  button.addEventListener('pointerup', up);
  button.addEventListener('pointercancel', up);
  button.addEventListener('pointerleave', up);
}

function updatePlayer(dt) {
  const p = game.player;
  const wasGrounded = p.grounded;
  const left = isDown('ArrowLeft', 'KeyA');

  const jump = wasPressed('Space', 'ArrowUp', 'KeyW');
  const jumpHeld = isDown('Space', 'ArrowUp', 'KeyW');
  const axis = (right ? 1 : 0) - (left ? 1 : 0);
  if (wasPressed('ShiftLeft', 'ShiftRight')) startDash(axis || p.facing);

  if (wasPressed('KeyE')) interact();

    game.dash.time = Math.max(0, game.dash.time - dt);

  } else {
    const speed = game.skill.active > 0 ? CONFIG.runSpeed * 2 : CONFIG.runSpeed;
    if (axis) { p.vx += axis * 850 * dt; p.facing = axis; }

  if (p.grounded) game.coyote = CONFIG.coyoteTime;

function updateCamera(dt) {
  const target = Math.max(0, Math.min(level.width - W, game.player.x - 150));
  game.cameraX += (target - game.cameraX) * Math.min(1, dt * 7);
}
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) game.particles.push({ x, y, vx: (Math.random() - .5) * 80, vy: (Math.random() - .5) * 80, life: .25 + Math.random() * .4, max: .65, color, size: Math.random() < .7 ? 2 : 3 });
}
function updateParticles(dt) {
  for (const part of game.particles) { part.life -= dt; part.x += part.vx * dt; part.y += part.vy * dt; part.vy += 80 * dt; }
  game.particles = game.particles.filter(part => part.life > 0);
}

const introImage = new Image();
introImage.src = '开始界面.png';
function render() {
  ctx.clearRect(0, 0, W, H);
  if (game.mode === 'intro') { drawIntro(); return; }
  drawBackground();
  if (game.mode === 'title') { drawTitle(); return; }
  ctx.save();
  ctx.translate(-Math.floor(game.cameraX), 0);
  drawWorld();
  drawPlayer();
  drawParticles();
  ctx.restore();
  drawHud();
  if (game.mode === 'clear') drawClear();
}
function drawIntro() {
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, W, H);
  if (!introImage.complete || introImage.naturalWidth <= 0) return;
  const scale = Math.max(W / introImage.naturalWidth, H / introImage.naturalHeight);
  const drawW = introImage.naturalWidth * scale;
  const drawH = introImage.naturalHeight * scale;
  ctx.drawImage(introImage, (W - drawW) / 2, (H - drawH) / 2, drawW, drawH);
  if (game.introTime > game.introDuration) {
    const fade = Math.min(1, (game.introTime - game.introDuration) / game.introFade);
    ctx.fillStyle = '#05070c'; ctx.globalAlpha = fade; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
}
function drawBackground() {
  const reverse = game.plane === 'reverse';
  ctx.fillStyle = reverse ? '#170f25' : '#09151d';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = reverse ? 'rgba(137, 86, 190, .11)' : 'rgba(65, 205, 225, .08)';
  for (let x = -((game.cameraX * .15) % 48); x < W; x += 48) ctx.fillRect(x, 42, 1, 210);
  for (let y = 44; y < 280; y += 32) ctx.fillRect(0, y, W, 1);
  ctx.fillStyle = reverse ? 'rgba(210, 152, 255, .10)' : 'rgba(120, 226, 244, .08)';
  ctx.beginPath(); ctx.arc(390, 68, 45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = reverse ? COLORS.reverse : COLORS.cyan;
  ctx.globalAlpha = .55;
  ctx.fillRect(382, 60, 16, 16);
  ctx.globalAlpha = 1;
}
function drawWorld() {
  const world = currentWorld();
  for (const platform of world.platforms) drawPlatform(platform, game.plane);
  drawExit(world.exit);
  drawObjects(world);
  for (let i = 0; i < world.coins.length; i++) {
    const coin = world.coins[i];
    if (!game.coins.has(`${game.plane}:${i}`)) drawCoin(coin.x, coin.y);
  }
  drawSectionMarker(30, 'A  出生教学'); drawSectionMarker(440, 'B  位面跳跃');
  drawSectionMarker(900, 'C  陷阱与传送门'); drawSectionMarker(1230, 'D  追踪区');
  drawSectionMarker(1740, 'E  四组件解密'); drawSectionMarker(2200, 'F  敏捷试炼');
}
function drawObjects(world) {
  for (const platform of world.movingPlatforms || []) drawPlatform(platform, game.plane, true);
  for (const spike of world.spikes || []) drawSpikes(spike);
  drawLockedDoor(world.lockedDoor);
  for (const rocket of world.rockets || []) {
    const warning = rocket.phase > rocket.period - .7;
    if (warning) { ctx.strokeStyle = 'rgba(255,110,125,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(rocket.x, rocket.y); ctx.lineTo(rocket.x - 38 * rocket.dir, rocket.y); ctx.stroke(); }
    ctx.fillStyle = COLORS.danger; ctx.fillRect(rocket.x - 4, rocket.y - 3, 8, 6); ctx.fillStyle = '#ffccb0'; ctx.fillRect(rocket.x - 2, rocket.y - 1, 4, 2);
  }
  for (const portal of world.portals || []) drawPortal(portal);
  for (const part of world.puzzleParts || []) drawPuzzlePart(part);
  for (const enemy of world.enemies || []) drawEnemy(enemy);
}
function drawPortal(portal) {
  const accent = game.plane === 'reverse' ? COLORS.reverse : COLORS.cyan;
  ctx.globalAlpha = .13 + Math.sin(game.elapsed * 5) * .04; ctx.fillStyle = accent; ctx.fillRect(portal.x - 13, portal.y - 30, 26, 34); ctx.globalAlpha = 1;
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.strokeRect(portal.x - 10, portal.y - 26, 20, 28);
  ctx.fillStyle = accent; ctx.fillRect(portal.x - 7, portal.y - 22, 2, 20); ctx.fillRect(portal.x + 5, portal.y - 22, 2, 20);
  ctx.fillStyle = COLORS.text; ctx.font = '7px monospace'; ctx.fillText(portal.id, portal.x - 2, portal.y - 31); if (Math.abs(game.player.x - portal.x) < 30) ctx.fillText('E 传送', portal.x - 16, portal.y - 38);
}
function drawPuzzlePart(part) {
  const solved = game.puzzle.progress.includes(part.id);
  const accent = solved ? COLORS.gold : part.plane === 'reverse' ? COLORS.reverse : COLORS.cyan;
  ctx.globalAlpha = .16; ctx.fillStyle = accent; ctx.fillRect(part.x - 12, part.y - 22, 24, 24); ctx.globalAlpha = 1;
  ctx.fillStyle = accent; ctx.fillRect(part.x - 9, part.y - 19, 18, 18); ctx.fillStyle = COLORS.ink; ctx.fillRect(part.x - 6, part.y - 16, 12, 12);
  ctx.fillStyle = accent; ctx.font = 'bold 10px monospace'; ctx.fillText(part.symbol, part.x - 5, part.y - 6);
  ctx.fillStyle = COLORS.dim; ctx.font = '7px monospace'; ctx.fillText(`${part.id} · E`, part.x - 10, part.y - 25);
}
function drawEnemy(enemy) {
  ctx.fillStyle = enemy.seen > 0 ? COLORS.danger : '#3d263e'; ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h); ctx.fillStyle = enemy.seen > 0 ? '#ff9b9b' : COLORS.reverse; ctx.fillRect(enemy.x + 3, enemy.y + 4, 3, 3);
  if (enemy.seen > 0) { ctx.fillStyle = COLORS.danger; ctx.globalAlpha = .2; ctx.beginPath(); ctx.arc(enemy.x + 7, enemy.y + 8, 19, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = COLORS.danger; ctx.font = '8px monospace'; ctx.fillText('追踪中', enemy.x - 8, enemy.y - 6); }
}
function drawExit(exit) {
  if (!exit) return;
  ctx.strokeStyle = game.puzzle.solved ? COLORS.gold : COLORS.dim; ctx.lineWidth = 2; ctx.strokeRect(exit.x, exit.y, exit.w, exit.h); ctx.fillStyle = game.puzzle.solved ? 'rgba(255,216,117,.18)' : 'rgba(110,156,167,.12)'; ctx.fillRect(exit.x + 3, exit.y + 3, exit.w - 6, exit.h - 3); ctx.fillStyle = COLORS.text; ctx.font = '7px monospace'; ctx.fillText(game.puzzle.solved ? '出口' : '封锁', exit.x + 9, exit.y - 7);
}
function drawWorldLabel(x, y, text) {
  ctx.fillStyle = COLORS.dim;
  ctx.font = '9px monospace';
  ctx.fillText(text, x, y);
}
function drawSectionMarker(x, label) {
  if (x < game.cameraX - 40 || x > game.cameraX + W + 40) return;
  ctx.fillStyle = game.plane === 'reverse' ? 'rgba(216, 156, 255, .55)' : 'rgba(120, 226, 244, .55)';
  ctx.font = '7px monospace'; ctx.fillText(label, x, 30);
  ctx.fillRect(x, 34, 1, 8);
}
function drawSpikes(spike) {
  ctx.fillStyle = COLORS.danger;
  const count = Math.max(1, Math.floor(spike.w / 8));
  for (let i = 0; i < count; i++) {
    const x = spike.x + i * 8;
    ctx.beginPath(); ctx.moveTo(x, spike.y + spike.h); ctx.lineTo(x + 4, spike.y); ctx.lineTo(x + 8, spike.y + spike.h); ctx.fill();
  }
}
function drawLockedDoor(door) {
  if (!door) return;
  const unlocked = game.puzzle.solved;
  ctx.fillStyle = unlocked ? 'rgba(255,216,117,.2)' : 'rgba(255,166,48,.22)';
  ctx.fillRect(door.x, door.y, door.w, door.h);
  ctx.strokeStyle = unlocked ? COLORS.gold : '#ffad38'; ctx.lineWidth = 2; ctx.strokeRect(door.x + 1, door.y + 1, door.w - 2, door.h - 2);
  ctx.fillStyle = unlocked ? COLORS.gold : '#ffad38'; ctx.fillRect(door.x + 8, door.y + 28, 8, 10);
  ctx.fillStyle = COLORS.ink; ctx.fillRect(door.x + 10, door.y + 31, 4, 7);
  ctx.fillStyle = COLORS.text; ctx.font = '7px monospace'; ctx.fillText(unlocked ? 'OPEN' : '锁门', door.x - 2, door.y - 7);
}
function drawPlatform(p, plane, moving = false) {
  const color = plane === 'reverse' ? COLORS.reversePlatform : COLORS.normalPlatform;
  ctx.fillStyle = moving ? '#59636b' : p.kind === 'ground' ? '#213c48' : color;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = plane === 'reverse' ? COLORS.reverse : COLORS.cyan;
  ctx.fillRect(p.x, p.y, p.w, 2);
  ctx.globalAlpha = .28; ctx.fillRect(p.x + 4, p.y + 5, Math.max(0, p.w - 8), 1); ctx.globalAlpha = 1;
  const tile = plane === 'reverse' ? assetImages.stone : assetImages.ground;
  if (tile.complete && tile.naturalWidth > 0) {
    ctx.globalAlpha = .82;
    for (let x = p.x; x < p.x + p.w; x += 18) ctx.drawImage(tile, x, p.y + 2, Math.min(18, p.x + p.w - x), Math.min(18, p.h - 2));
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = plane === 'reverse' ? '#e0a8ff' : '#a8f4e9';
  ctx.fillRect(p.x, p.y, p.w, 2);
  ctx.fillStyle = plane === 'reverse' ? '#8b54b5' : '#247c80';
  ctx.fillRect(p.x, p.y + 2, p.w, 2);
  if (p.h > 18) { ctx.fillStyle = 'rgba(3,10,16,.42)'; ctx.fillRect(p.x, p.y + 18, p.w, p.h - 18); }
  ctx.fillStyle = plane === 'reverse' ? 'rgba(216,156,255,.36)' : 'rgba(120,226,244,.28)';
  for (let x = p.x + 5; x < p.x + p.w - 3; x += 18) ctx.fillRect(x, p.y + 7, 2, 2);
}
function drawCoin(x, y) {
  const pulse = 1 + Math.sin(game.elapsed * 5 + x * .03) * .08;
  ctx.save(); ctx.translate(x, y); ctx.scale(pulse, 1);
  ctx.globalAlpha = .18; ctx.fillStyle = COLORS.gold; ctx.fillRect(-9, -9, 18, 18); ctx.globalAlpha = 1;
  ctx.fillStyle = '#8c6328'; ctx.fillRect(-4, -8, 8, 16); ctx.fillRect(-7, -5, 14, 10);
  ctx.fillStyle = COLORS.gold; ctx.fillRect(-3, -7, 6, 14); ctx.fillRect(-6, -4, 12, 8);
  ctx.fillStyle = '#fff3a8'; ctx.fillRect(-2, -5, 2, 5); ctx.fillRect(-4, -2, 2, 3);
  ctx.fillStyle = '#e2a73d'; ctx.fillRect(2, 3, 3, 2);
  ctx.restore();
}
function drawGate() {
  ctx.fillStyle = 'rgba(120,226,244,.14)'; ctx.fillRect(1534, 212, 42, 60);
  ctx.fillStyle = COLORS.cyan; ctx.fillRect(1534, 212, 3, 60); ctx.fillRect(1573, 212, 3, 60); ctx.fillRect(1534, 212, 42, 3);
  ctx.fillStyle = COLORS.text; ctx.font = '7px monospace'; ctx.fillText('出口', 1542, 204);
}
function drawPlayer() {
  const p = game.player;
  if (game.invulnerable > 0 && Math.floor(game.invulnerable * 16) % 2 === 0) return;
  const accent = game.plane === 'reverse' ? COLORS.reverse : COLORS.cyan;
  const hasMoveInput = isDown('ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD');
  const moving = hasMoveInput && Math.abs(p.vx) > 8 && p.grounded;
  const frame = moving ? Math.floor(game.elapsed * 9) % playerSprites.length : 1;
  const sprite = playerSprites[frame];
  const drawW = 15;
  const drawH = 29;
  const drawX = Math.round(p.x + p.w / 2 - drawW / 2);
  const drawY = Math.round(p.y + p.h - drawH);
  ctx.save();
  if (p.facing > 0) {
    ctx.translate(drawX * 2 + drawW, 0);
    ctx.scale(-1, 1);
  }
  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.drawImage(sprite, 39, 16, 50, 97, drawX, drawY, drawW, drawH);
  }
  ctx.restore();
  ctx.fillStyle = accent;
  ctx.globalAlpha = .22;
  ctx.fillRect(p.x - 4, p.y + p.h + 1, p.w + 8, 2);
  ctx.globalAlpha = 1;
  if (game.transition.time > 0) {
    ctx.strokeStyle = accent;
    ctx.globalAlpha = .5 + Math.sin(game.elapsed * 30) * .25;
    ctx.strokeRect(drawX - 3, drawY - 3, drawW + 6, drawH + 6);
    ctx.globalAlpha = 1;
  }
}
function drawParticles() {
  for (const part of game.particles) { ctx.globalAlpha = Math.max(0, part.life / part.max); ctx.fillStyle = part.color; ctx.fillRect(part.x, part.y, part.size, part.size); }
  ctx.globalAlpha = 1;
}
function drawHud() {
  const accent = game.plane === 'reverse' ? COLORS.reverse : COLORS.cyan;
  ctx.fillStyle = 'rgba(6,16,22,.92)'; ctx.fillRect(8, 8, 464, 48);
  ctx.strokeStyle = game.plane === 'reverse' ? 'rgba(216,156,255,.55)' : 'rgba(120,226,244,.55)'; ctx.strokeRect(8.5, 8.5, 463, 47);
  ctx.fillStyle = COLORS.text; ctx.font = 'bold 10px monospace'; ctx.fillText('双界回廊', 17, 23);
  ctx.fillStyle = accent; ctx.fillText(game.plane === 'normal' ? '常态' : '反面', 86, 23);
  ctx.fillStyle = COLORS.dim; ctx.font = '8px monospace'; ctx.fillText('Q 位面', 130, 22);
  const cooldown = game.transition.time > 0 ? '切换中' : game.switchCooldown > 0 ? `冷却 ${game.switchCooldown.toFixed(1)}s` : '可切换';
  ctx.fillStyle = game.switchCooldown > 0 || game.transition.time > 0 ? COLORS.dim : accent; ctx.fillText(cooldown, 130, 34);
  ctx.fillStyle = COLORS.danger; ctx.fillText(`生命 ${'◆'.repeat(game.hp)}${'◇'.repeat(Math.max(0, game.maxHp - game.hp))}`, 17, 47);
  ctx.fillStyle = COLORS.text; ctx.fillText(`金币 ${game.coins.size}/${level.totalCoins}`, 330, 22);
  ctx.fillStyle = COLORS.dim; ctx.fillText(`传送 ${game.portalCooldown > 0 ? game.portalCooldown.toFixed(1) + 's' : '可用'}  ·  重开 ${game.deaths}`, 280, 47);
  if (game.message.time > 0) {
    const width = Math.max(120, ctx.measureText(game.message.text).width + 24);
    ctx.fillStyle = 'rgba(9,22,29,.92)'; ctx.fillRect((W - width) / 2, 52, width, 22);
    ctx.strokeStyle = accent; ctx.strokeRect((W - width) / 2 + .5, 52.5, width - 1, 21);
    ctx.fillStyle = COLORS.white; ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.fillText(game.message.text, W / 2, 67); ctx.textAlign = 'left';
  }
  ctx.fillStyle = 'rgba(8,16,22,.88)'; ctx.fillRect(12, 274, 456, 34);
  ctx.fillStyle = COLORS.text; ctx.font = '8px monospace'; ctx.fillText('A/D 移动  ·  空格跳跃/二段跳  ·  Shift 冲刺  ·  Q 位面  ·  E 互动/传送  ·  J 攻击  ·  1/K 技能', 20, 288);
  ctx.fillStyle = game.skill.active > 0 ? COLORS.gold : COLORS.dim; ctx.fillText(`技能：敏捷 ×${game.skill.agility}${game.skill.active > 0 ? `  生效 ${game.skill.active.toFixed(1)}s` : ''}`, 20, 301);
  if (game.puzzle.progress.length > 0) { ctx.fillStyle = COLORS.cyan; ctx.fillText(`解密进度：${game.puzzle.progress.join(' → ')}${game.puzzle.solved ? '  ✓' : ''}`, 300, 301); }
}
function drawTitle() {
  ctx.fillStyle = COLORS.cyan; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.fillText('双界回廊', W / 2, 104);
  ctx.fillStyle = COLORS.reverse; ctx.font = '10px monospace'; ctx.fillText('T W I N   R E A L M   C O R R I D O R', W / 2, 124);
  ctx.fillStyle = COLORS.text; ctx.font = '11px monospace'; ctx.fillText(game.levelIndex === 0 ? '第一关 · 双界回廊' : '第二关 · 复苏之径', W / 2, 164);
  ctx.fillStyle = COLORS.dim; ctx.font = '9px monospace'; ctx.fillText('移动  A / D   跳跃  空格   切换位面  Q', W / 2, 201);
  ctx.fillStyle = 'rgba(120,226,244,.12)'; ctx.fillRect(150, 226, 180, 30);
  ctx.strokeStyle = COLORS.cyan; ctx.strokeRect(150.5, 226.5, 179, 29);
  ctx.fillStyle = COLORS.white; ctx.font = 'bold 10px monospace'; ctx.fillText('按 Enter / 空格开始', W / 2, 245);
  ctx.textAlign = 'left';
}
function drawClear() {
  ctx.fillStyle = 'rgba(5,12,17,.82)'; ctx.fillRect(72, 78, 336, 166);
  ctx.strokeStyle = COLORS.gold; ctx.strokeRect(72.5, 78.5, 335, 165);
  ctx.fillStyle = COLORS.gold; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center'; ctx.fillText(`${game.levelIndex === 0 ? '第一关' : '第二关'} 完成`, W / 2, 117);
  ctx.fillStyle = COLORS.text; ctx.font = '10px monospace'; ctx.fillText(game.levelIndex === 0 ? '你已通过双界桥廊' : '你已穿过复苏之径，抵达白色大教堂屋顶', W / 2, 145);
  ctx.fillStyle = COLORS.dim; ctx.font = '9px monospace'; ctx.fillText(`收集碎片：${game.coins.size} · 位面切换：${game.stats.switched} 次`, W / 2, 168);
  ctx.fillText('这只是第一段，后续将加入陷阱、传送门与解密', W / 2, 190);
  ctx.fillStyle = COLORS.white; ctx.fillText('按 Enter / 空格重新体验', W / 2, 220); ctx.textAlign = 'left';
}

let previous = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - previous) / 1000);
  previous = now;
  update(dt);
  render();
  input.pressed.clear();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
